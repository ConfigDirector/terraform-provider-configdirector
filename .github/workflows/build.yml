name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    concurrency: build-and-test
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5

      - name: Build
        run: make build

      - name: Test
        run: make test_integration
        env:
          TF_ACC: 1
          CONFIGDIRECTOR_TOKEN: ${{ secrets.CONFIGDIRECTOR_API_TOKEN }}
